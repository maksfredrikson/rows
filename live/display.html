<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The room weaves · wall</title>
<style>
  html,body{height:100%}
  body{margin:0;background:#efe6d6;color:#34281a;font:14px/1.4 -apple-system,Helvetica,sans-serif;display:flex;overflow:hidden}
  #stage{flex:1;min-width:0;height:100%}
  #cv{display:block}
  #side{flex:none;width:clamp(200px,20vw,280px);box-sizing:border-box;padding:18px 18px 18px 6px;display:flex;flex-direction:column;gap:14px;height:100%}
  #side h1{font-size:18px;font-weight:600;margin:0}
  #count{font-size:clamp(34px,4vw,56px);font-weight:600;line-height:1}
  #count small{display:block;font-size:13px;font-weight:400;opacity:.75;margin-top:4px}
  #side button{font:inherit;border:1px solid #34281a;border-radius:8px;background:transparent;color:inherit;padding:8px 12px;cursor:pointer}
  #side button.on{background:#34281a;color:#efe6d6}
  #now{font-size:13px;opacity:.75;min-height:20px}
  #join{margin-top:auto;font-size:13px}
  #qr{background:#fff;padding:10px;border-radius:8px;margin-bottom:10px;cursor:zoom-in;width:fit-content}
  #qr img,#qr canvas{display:block;width:100%;height:auto;image-rendering:pixelated}
  #qr.big{position:fixed;inset:0;margin:auto;z-index:10;width:min(78vh,78vw);height:min(78vh,78vw);box-sizing:border-box;padding:4vh;cursor:zoom-out;box-shadow:0 0 0 100vmax rgba(52,40,26,.82)}
  #join b{display:block;font-size:clamp(15px,1.4vw,19px);font-weight:600;word-break:break-all}
</style>
</head>
<body>
<div id="stage"><canvas id="cv"></canvas></div>
<div id="side">
  <h1>The room weaves</h1>
  <div id="count">0<small>symbols on the wall</small></div>
  <button id="snd">Sound off</button>
  <div id="now"></div>
  <div id="join"><div id="qr" title="Click to enlarge"></div>Scan, or type<b id="addr"></b></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="wall.js?v=2"></script>
</body>
</html>
