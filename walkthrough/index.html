<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Room Weaves</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Lo-fi: greys for everything, blue only for interaction. No status colours in this concept. */
:root{--ink:#222;--muted:#787878;--line:#d9d9d9;--fill:#f0f0f0;--bar:#b8b8b8;--white:#fff;--acc:#3373f2;--accS:#e6efff;--dark:#2a2a2a;--darkCell:#444;--lightCell:#e4e4e4}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Work Sans',system-ui,sans-serif;color:var(--ink);background:#e9e9e9;font-size:13px;line-height:1.35;display:flex;flex-direction:column}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.wt{flex:none;background:#1c1c1c;color:#fff;display:flex;align-items:center;gap:20px;padding:14px 24px}
.wt .lab{font-size:11px;font-weight:600;letter-spacing:.06em;color:#9a9a9a;flex:none;width:96px}
.wt .story{font-size:15px;line-height:1.45;flex:1;max-width:1000px}
.wt-top .dots{flex:none;display:flex;gap:6px}
.wt-top .dots i{width:28px;height:4px;border-radius:2px;background:#4a4a4a;display:block;cursor:pointer}
.wt-top .dots i.on{background:#fff}
.wt-top .title{flex:none;font-weight:600;color:#cfcfcf;min-width:210px}
.wt-bot .act{flex:none;color:#8fb3ff;font-weight:600}
.wt-bot .nav{flex:none;display:flex;gap:8px;margin-left:auto}
.wt-bot .nav button{border:1px solid #555;border-radius:8px;padding:9px 14px;font-weight:500;color:#ddd}
.wt-bot .nav button.next{background:#fff;color:#111;border-color:#fff;font-weight:600}
.wt-bot .nav button:disabled{opacity:.35;cursor:default}
.stage{flex:1;overflow:auto;padding:20px}
.app{width:1200px;margin:0 auto;background:var(--white);border:1px solid var(--line);display:grid;grid-template-columns:200px 1fr;min-height:100%}
.side{background:var(--fill);padding:16px 12px;display:flex;flex-direction:column;gap:2px}
.side .brand{font-weight:600;padding:0 6px 6px}
.side .sec{font-size:9px;font-weight:600;color:#999;padding:12px 6px 4px}
.side .nav{padding:4px 6px;border-radius:4px;color:var(--muted);font-size:12px}
.side .nav.on{background:var(--white);color:var(--ink);font-weight:500}
.side .note{margin-top:auto;font-size:11px;color:var(--muted);padding:6px;line-height:1.4}
.main{padding:20px 24px 32px;display:flex;flex-direction:column;gap:16px;min-width:0;align-items:center}
.btn{border:1px solid var(--line);border-radius:6px;padding:6px 12px;font-weight:500;font-size:12px;background:var(--white)}
.btn.pri{background:var(--ink);border-color:var(--ink);color:#fff}
.btn:disabled{opacity:.35;cursor:default}
.muted{color:var(--muted)}
/* the phone */
.phone{width:375px;min-height:720px;border:1px solid var(--line);border-radius:28px;background:var(--white);padding:22px 18px 18px;display:flex;flex-direction:column;gap:14px}
.phone .hd{display:flex;align-items:baseline;gap:8px}
.phone .hd h1{font-size:17px;font-weight:500;flex:1}
.phone .hd .mark{font-size:11px;color:var(--muted);letter-spacing:.08em}
.phone .foot{margin-top:auto;display:flex;gap:8px;justify-content:flex-end;align-items:center}
.deal{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.card{border:1px solid var(--line);border-radius:8px;padding:8px;display:flex;flex-direction:column;gap:6px;align-items:center;cursor:pointer;background:var(--white)}
.card.sel{border-color:var(--acc);background:var(--accS)}
.card .nm{font-size:10px;color:var(--muted);text-align:center;line-height:1.25}
.grid{display:grid;grid-template-columns:repeat(11,1fr);gap:2px;width:100%;aspect-ratio:1;touch-action:none;background:var(--line);padding:2px;border-radius:4px}
.cell{background:var(--white);border-radius:1px;position:relative;cursor:pointer}
.cell.ghost::after{content:'';position:absolute;inset:30%;border-radius:50%;background:var(--bar)}
.cell.ink{background:var(--ink)}
.cell.ink.ghost::after{background:var(--white);opacity:.5}
.lineinfo{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.two .sym{border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:6px;align-items:center}
.two .sym .k{font-size:10px;letter-spacing:.08em;color:var(--muted)}
.where{border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:4px;cursor:pointer}
.where b{font-weight:500}
/* the display */
.disp{width:960px;background:var(--dark);border-radius:6px;color:#ddd;padding:14px 16px 10px;display:flex;flex-direction:column;gap:10px;position:relative}
.disp .bar{display:flex;align-items:center;gap:18px;font-size:12px;color:#bbb}
.disp .bar .sp{flex:1}
.disp .bar .k{display:inline-flex;gap:6px;align-items:center}
.disp .bar .k i{display:inline-block;width:10px;height:10px}
.disp .bar .k i.a{border:1px solid #ddd}
.disp .bar .k i.m{background:#ddd}
.disp .bar button{color:#ddd;border:1px solid #555;border-radius:6px;padding:4px 10px;font-size:12px}
.band{position:relative;overflow:hidden;background:#1a1a1a;border-radius:4px}
.band svg{display:block}
.band .ph{position:absolute;top:0;bottom:0;width:1px;background:#8a8a8a;left:66%}
.labels{display:flex;gap:28px;font-size:11px;color:#9a9a9a;min-height:16px;padding:0 4px}
.labels b{color:#ddd;font-weight:500}
.join{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:40px}
.qr{width:200px;height:200px;background:#fff;padding:12px;cursor:pointer;display:grid;grid-template-columns:repeat(21,1fr);gap:0}
.qr i{display:block;background:#fff}.qr i.b{background:#111}
.join .txt{font-size:22px;color:#eee;line-height:1.5}
.join .txt small{display:block;font-size:14px;color:#9a9a9a}
.brk{position:absolute;border:2px solid var(--acc);box-shadow:0 0 0 2000px rgba(0,0,0,.45);pointer-events:none}
.disp .pm{display:flex;gap:10px;align-items:center;font-size:12px;color:#bbb}
.disp .pm button{color:#ddd;border:1px solid #555;border-radius:6px;padding:4px 10px;font-size:12px}
.disp .pm button.pri{background:#fff;color:#111;border-color:#fff}
/* the printer */
.paper{width:300px;background:#fafafa;border:1px solid var(--line);padding:18px 14px 40px;display:flex;flex-direction:column;gap:10px;font-family:ui-monospace,Menlo,monospace;font-size:10px;color:#333;box-shadow:0 8px 20px rgba(0,0,0,.08)}
.paper .tear{border-top:1px dashed #bbb;margin-top:10px}
.paper svg{display:block;width:100%}
.printer{display:flex;flex-direction:column;align-items:center;gap:0}
.printer .body{width:360px;height:40px;background:#cfcfcf;border-radius:8px 8px 0 0}
.hot{outline:2px solid var(--acc);outline-offset:2px;border-radius:6px;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(51,115,242,.45)}50%{box-shadow:0 0 0 8px rgba(51,115,242,0)}}
@keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-480px)}}
.band g.run{animation:scroll 24s linear infinite}
.band g.run.frozen{animation-play-state:paused}

/* rows */
.arr{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.arr .card{align-items:stretch;gap:4px}
.arr .card .nm{text-align:left}
.arr .card svg{width:100%;height:auto}
.rowbox{border:1px solid var(--line);border-radius:8px;padding:8px;display:flex;flex-direction:column;gap:4px}
.rowbox .k{font-size:10px;letter-spacing:.08em;color:var(--muted)}
.rowbox svg{width:100%;height:auto;display:block}
.stepper{display:inline-flex;align-items:center;gap:4px}
.stepper .v{min-width:72px;text-align:center;border:1px solid var(--line);border-radius:4px;padding:3px 8px;font-size:12px}
.stepper button{width:24px;height:24px;border:1px solid var(--line);border-radius:4px;font-weight:600}
.rows{display:flex;flex-direction:column;gap:0;padding:6px 0}
.rline{display:flex;align-items:center;gap:14px;border-radius:4px;padding:2px 4px}
.rline svg{display:block;flex:none}
.rline .lb{font-size:11px;color:#9a9a9a;line-height:1.3}
.rline .lb b{color:#ddd;font-weight:500}
.head{border-top:1px dashed #8a8a8a;margin:2px 4px;position:relative}
.head span{position:absolute;right:0;top:-14px;font-size:10px;color:#9a9a9a}
.paper .prow{margin:2px 0}
.paper .edge{border-top:2px solid #bbb;margin-top:6px;position:relative}
.paper .edge span{position:absolute;right:0;top:2px;font-size:9px;color:#888}

/* the table instrument */
.inst{width:720px;background:#dedede;border-radius:14px;padding:18px 20px 22px;display:flex;flex-direction:column;gap:14px;box-shadow:inset 0 1px 0 #fff,0 10px 24px rgba(0,0,0,.12)}
.inst .strip{background:#1a1a1a;border-radius:6px;padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.inst .strip .k{font-size:10px;letter-spacing:.08em;color:#9a9a9a;display:flex;justify-content:space-between}
.inst .strip svg{width:100%;height:auto;display:block}
.keys{display:grid;grid-template-columns:repeat(4,1fr) 20px repeat(2,80px) 20px 1fr;gap:10px;align-items:stretch}
.key{background:#f6f6f6;border:1px solid #bdbdbd;border-bottom-width:4px;border-radius:8px;min-height:74px;display:flex;flex-direction:column;justify-content:space-between;padding:8px 10px;font-size:12px;cursor:pointer;text-align:left}
.key .cnt{font-size:10px;color:var(--muted)}
.key .ico{font-size:18px;line-height:1}
.key.sel{background:var(--accS);border-color:var(--acc)}
.key.wide{background:#2a2a2a;color:#fff;border-color:#111;justify-content:center;align-items:center;font-weight:600}
.key.ped{justify-content:center;align-items:center;font-size:20px}
.inst .legend{font-size:11px;color:var(--muted);display:flex;justify-content:space-between}
</style>
</head>
<body>
<div class="wt wt-top" id="wtTop"></div>
<div class="stage"><div class="app" id="app"></div></div>
<div class="wt wt-bot" id="wtBot"></div>
<script>
const STEPS=[
 {page:'join',dev:'display',title:'Display · Join',act:'Scan the code',hot:'#qr',
  cons:'When the second half starts, I want to see one code on the projector and the band so far under it, so I know where to point my phone and what we are adding to.',
  aff:'When I have scanned the code, I want the page to open at once without a login, so I can take part before the moment passes.'},
 {page:'pick',dev:'phone',title:'Phone · Pick',act:'Tap a symbol',hot:'[data-pick="S0010"]',
  cons:'When the page opens, I want twelve symbols from the album with their sheet numbers, so I can choose one by its form alone.',
  aff:'When one catches my eye, I want to tap it, so I can enter it my own way.'},
 {page:'trace',dev:'phone',title:'Phone · Trace',act:'Done',hot:'#done',
  cons:'When the symbol lies faint on the grid, I want to see which cells are still to do, so I can finish it at my own pace.',
  aff:'When every cell is inked, I want Done to light up, so I can carry the way I made it into the next step.'},
 {page:'make',dev:'phone',title:'Phone · Make',act:'Send to the table',hot:'#toRow',
  cons:'When I face the empty grid with the given symbol beside it, I want the form name of what I draw to appear as I draw, so I can see what I have made without anyone naming it for me.',
  aff:'When my symbol is done, I want to send it to the table, so I can go and play it into a row with my hands.'},
 {page:'keys',dev:'table',title:'Table · Play the row',act:'Lay it in',hot:'#layin',
  cons:'When my symbol reaches the table, I want it on the strip above the keys with the given row beside it, and on each key how often the plates use that arrangement, so I can feel the grammar in my hands without being told which is right.',
  aff:'When I press a key, I want the row to change on the strip and on the projector at once, so I can play until it reads right and then press Lay in, which sends both rows to the band.'},
 {page:'sent',dev:'phone',title:'Phone · Sent',act:'Open where it went',hot:'#where',
  cons:'When I have sent, I want both rows replayed at the pace I made them, so I recognise my own hand in them.',
  aff:'When the page says which rows are mine and when they enter, I want to look up at the projector, so I can watch them arrive and then come out of the printer.'},
 {page:'band',dev:'display',title:'Display · Band',act:'Watch your row enter',hot:'#newest',
  cons:'When the band grows row by row, I want given rows and made rows to look different at a glance and each to carry its source, so I can ask whose the band is.',
  aff:'When my row enters at the bottom, I want to see the print head a few rows behind it, so I know the paper is catching up without anyone pressing anything.'},
 {page:'printer',dev:'printer',title:'Printer · As it goes',act:'Tear here',hot:'#tear',
  cons:'When the strip creeps out in slow motion, I want the paper to show the same rows as the projector with names and kinds beside them, so the paper says who made what.',
  aff:'When the part I want is out, I want to tear it off at the dashed line, so the band keeps printing for the next person.'}];

// --- placeholder data: real form-only symbols from the 1953 dictionary (commons.json) ---
const SYM={
 S0010:{name:'rhombus with centre r2',rows:['..#..','.###.','##.##','.###.','..#..'],ex:'sheets 7, 12, 38a',given:{dx:4,dy:4,n:11}},
 S0013:{name:'figure 5×3, one mirror',rows:['..#..','.###.','#####'],ex:'sheets 4, 9',given:{dx:6,dy:0,n:7}},
 S0014:{name:'chevron',rows:['..#..','.#.#.','#...#'],ex:'sheets 9, 21',given:{dx:5,dy:0,n:5}},
 S0015:{name:'colour part 3×3, diagonal mirror',rows:['..#','.##','###'],ex:'sheets 2, 7',given:{dx:3,dy:3,n:9}},
 S0016:{name:'figure 5×3, one mirror',rows:['..#..','.###.','##.##'],ex:'sheets 6, 13',given:{dx:6,dy:0,n:4}},
 S0018:{name:'cross',rows:['.#.','###','.#.'],ex:'sheets 1, 3, 10',given:{dx:4,dy:0,n:14}},
 S0024:{name:'solid rhombus',rows:['..#..','.###.','#####','.###.','..#..'],ex:'sheets 5, 7, 12',given:{dx:6,dy:0,n:9}},
 S0155:{name:'saltire 5',rows:['#...#','.#.#.','..#..','.#.#.','#...#'],ex:'sheets 2, 46',given:{dx:4,dy:4,n:6}},
 S0226:{name:'colour part 6×6, diagonal mirror',rows:['....#.','...###','...###','.##.##','####.#','.####.'],ex:'sheets 23, 44',given:{dx:6,dy:0,n:5}},
 S0231:{name:'colour part 7×7, diagonal mirror',rows:['......#','.....##','....##.','...####','..##..#','.###...','##.##..'],ex:'sheets 12, 31',given:{dx:7,dy:0,n:4}},
 S0270:{name:'figure with openings 7×5, one mirror',rows:['...#...','..###..','.##.##.','#.....#','.#####.'],ex:'sheets 20, 38a',given:{dx:8,dy:0,n:6}},
 S0301:{name:'figure 7×7, fourfold mirror',rows:['#..#..#','.#.#.#.','..###..','#######','..###..','.#.#.#.','#..#..#'],ex:'sheets 15, 60',given:{dx:8,dy:0,n:3}}};
const DEAL=Object.keys(SYM);
// the plates' arrangements of a symbol along a row, with their counts over the 383 repeating bands (grammar.json, frieze groups)
const ARR=[{id:'both',name:'mirrored both ways',n:143},{id:'mirror',name:'in mirrored pairs',n:137},{id:'repeat',name:'repeated',n:63},{id:'turn',name:'turned in pairs',n:19}];
// rows from other phones already on the band
const OTHERS=[
 ['a','S0024'],['m',{rows:['.#.#.','##.##','.###.','..#..','.###.','##.##','.#.#.'],name:'7×5, 11 cells, mirror left–right',by:'JUNO',arr:'mirror',period:7}],
 ['a','S0231'],['m',{rows:['#...#','.#.#.','..#..'],name:'3×5, 5 cells, mirror left–right',by:'ELMR',arr:'repeat',period:6}],
 ['a','S0018'],['m',{rows:['#..','##.','###','##.','#..'],name:'5×3, 9 cells, mirror top–bottom',by:'TOVE',arr:'both',period:5}],
 ['a','S0270'],['m',{rows:['.##.','#..#','#..#','.##.','..#.','..#.'],name:'6×4, 10 cells',by:'AIKO',arr:'turn',period:6}],
 ['a','S0155'],['m',{rows:['..#..','.#.#.','#...#','.#.#.','..#..'],name:'5×5, 8 cells, fourfold mirror',by:'RUNE',arr:'mirror',period:6}]];

// All state in one object; every change re-renders.
const S={step:0,chosen:'S0010',trace:new Set(),make:new Set(),arr:'mirror',period:null};
const $=s=>document.querySelector(s);
const cellsOf=rows=>{const o=[];rows.forEach((r,y)=>[...r].forEach((c,x)=>{if(c==='#')o.push([y,x])}));return o};
const flipX=rows=>rows.map(r=>[...r].reverse().join(''));
const flipY=rows=>rows.slice().reverse();
function svgSym(rows,px,kind){const h=rows.length,w=rows[0].length;const cs=cellsOf(rows);
 const f=kind==='archive'?`fill="none" stroke="#ddd" stroke-width="1"`:kind==='made'?`fill="#ddd"`:`fill="#222"`;
 return `<svg viewBox="0 0 ${w*px} ${h*px}" width="${w*px}" height="${h*px}">${cs.map(([y,x])=>`<rect x="${x*px+.5}" y="${y*px+.5}" width="${px-1}" height="${px-1}" ${f}/>`).join('')}</svg>`}
function formName(set){if(!set.size)return '';const ys=[...set].map(k=>+k.split(',')[0]),xs=[...set].map(k=>+k.split(',')[1]);
 const y0=Math.min(...ys),y1=Math.max(...ys),x0=Math.min(...xs),x1=Math.max(...xs),h=y1-y0+1,w=x1-x0+1;
 const has=(y,x)=>set.has(y+','+x);let lr=true,tb=true;
 for(const k of set){const[y,x]=k.split(',').map(Number);if(!has(y,x0+x1-x))lr=false;if(!has(y0+y1-y,x))tb=false}
 const sym=lr&&tb?'two mirrors':lr?'mirror left–right':tb?'mirror top–bottom':'';
 return `${h}×${w}, ${set.size} cells${sym?', '+sym:''}`}
function setToRows(set){const ys=[...set].map(k=>+k.split(',')[0]),xs=[...set].map(k=>+k.split(',')[1]);
 const y0=Math.min(...ys),y1=Math.max(...ys),x0=Math.min(...xs),x1=Math.max(...xs);const rows=[];
 for(let y=y0;y<=y1;y++){let r='';for(let x=x0;x<=x1;x++)r+=set.has(y+','+x)?'#':'.';rows.push(r)}return rows}
function ghostKeys(id){const rows=SYM[id].rows,h=rows.length,w=rows[0].length,oy=Math.floor((11-h)/2),ox=Math.floor((11-w)/2);
 return new Set(cellsOf(rows).map(([y,x])=>(y+oy)+','+(x+ox)))}
function grid(which,ghost){let o='<div class="grid" data-grid="'+which+'">';for(let y=0;y<11;y++)for(let x=0;x<11;x++){const k=y+','+x;
 o+=`<div class="cell ${ghost&&ghost.has(k)?'ghost':''} ${S[which].has(k)?'ink':''}" data-cell="${k}"></div>`}return o+'</div>'}
const madeRows=()=>S.make.size>=3?setToRows(S.make):OTHERS[1][1].rows;
const madeName=()=>S.make.size>=3?formName(S.make):OTHERS[1][1].name;
const defPeriod=rows=>rows[0].length+2;

// --- a row: one symbol laid along 47 cells by an arrangement ---
// arr: 'repeat' | 'mirror' (p1m1) | 'both' (p2mm) | 'turn' (p2) | 'given' {dx,dy}: the plates' own offset of the symbol next to itself
function layRow(rows,arr,period,given){const W=47,h=rows.length,w=rows[0].length;const cells=[];let H=h;
 const variants=k=>arr==='mirror'?(k%2?flipX(rows):rows):arr==='turn'?(k%2?flipY(flipX(rows)):rows):arr==='both'?(k%2?flipX(rows):rows):rows;
 if(arr==='given'){H=h+Math.abs(given.dy);for(let k=0,x=0;x<W;k++,x+=given.dx){const y=k%2?0:Math.abs(given.dy);for(const[cy,cx]of cellsOf(rows))if(x+cx<W)cells.push([y+cy,x+cx])}}
 else{for(let k=0,x=0;x<W;k++,x+=period){const v=variants(k);for(const[cy,cx]of cellsOf(v))if(x+cx<W)cells.push([cy,x+cx]);
   if(arr==='both'){for(const[cy,cx]of cellsOf(flipY(v)))if(x+cx<W)cells.push([cy,x+cx])}}}
 return{h:H,cells}}
function svgRow(r,px,kind,opts={}){const o=[];const f=kind==='archive'?`fill="none" stroke="${opts.ink||'#ddd'}"`:`fill="${opts.ink||'#ddd'}"`;
 for(const[y,x]of r.cells)o.push(`<rect x="${x*px+1}" y="${y*px+1}" width="${px-2}" height="${px-2}" ${f}/>`);
 return `<svg viewBox="0 0 ${47*px} ${r.h*px}" width="${47*px}" height="${r.h*px}">${o.join('')}</svg>`}
function archiveRow(id){const s=SYM[id];return{kind:'archive',row:layRow(s.rows,'given',0,s.given),label:`<b>${s.name}</b><br>as on the plates: next to itself ${s.given.dx} across${s.given.dy?', '+s.given.dy+' up':''}, ${s.given.n} times · ${s.ex}`}}
function madeRow(m){const a=ARR.find(x=>x.id===m.arr);return{kind:'made',row:layRow(m.rows,m.arr,m.period),label:`<b>made</b> ${m.name}<br>${a.name}, every ${m.period} cells · ${m.by}`}}
function bandRows(){const out=[];for(const[k,v]of OTHERS)out.push(k==='a'?archiveRow(v):madeRow(v));
 out.push(archiveRow(S.chosen));out.push(madeRow({rows:madeRows(),name:madeName(),by:'KPWR',arr:S.arr,period:S.period||defPeriod(madeRows())}));return out}

function dispBar(n){return `<div class="bar"><span>ornament rows · 11 Nov</span><span class="k"><i class="a"></i>given ${n?6:0}</span><span class="k"><i class="m"></i>made ${n?6:0}</span><span class="sp"></span><span>tempo 120</span><span>swing 12 %</span><span>printer · row ${n?10:0} of ${n?12:0} · 4 s a row</span><span class="k" id="joinS">join · 192.168.2.1:4370</span></div>`}
function qr(){let o='<div class="qr" id="qr">';let s=7;for(let i=0;i<441;i++){s=(s*1103515245+12345)&0x7fffffff;const y=Math.floor(i/21),x=i%21;const eye=(y<7&&x<7)||(y<7&&x>13)||(y>13&&x<7);
 const b=eye?((y%7===0||y%7===6||x%7===0||x%7===6)||(y%7>=2&&y%7<=4&&x%7>=2&&x%7<=4))?1:0:(s>>8)&1;o+=`<i class="${b?'b':''}"></i>`}return o+'</div>'}
function rowsBlock(rows,px,head){return `<div class="rows">${rows.map((r,i)=>`<div class="rline" ${i===rows.length-1?'id="newest"':''}>${svgRow(r.row,px,r.kind)}<div class="lb">${r.label}</div></div>${head===i?'<div class="head"><span>print head · row '+(i+1)+'</span></div>':''}`).join('')}</div>`}

const PAGES={
 join:()=>{const rows=bandRows().slice(0,4);return `<div class="disp">${dispBar(0)}<div class="band" style="min-height:300px;padding:4px"><div style="opacity:.18">${rowsBlock(rows,10,-1)}</div><div class="join">${qr()}<div class="txt">Scan to weave<small>192.168.2.1:4370 · no app, no login</small><small>given 0 · made 0 · the printer waits</small></div></div></div></div>`},
 pick:()=>`<div class="phone"><div class="hd"><h1>Pick a symbol</h1><span class="mark">KPWR</span></div>
  <div class="deal">${DEAL.map(id=>`<div class="card ${S.chosen===id?'sel':''}" data-pick="${id}">${svgSym(SYM[id].rows,9,'ink')}<span class="nm">${SYM[id].name}<br>${SYM[id].ex}</span></div>`).join('')}</div>
  <div class="foot"><button class="btn" id="redeal">Deal again</button></div></div>`,
 trace:()=>{const g=ghostKeys(S.chosen),done=[...g].filter(k=>S.trace.has(k)).length;return `<div class="phone"><div class="hd"><h1>Enter it your way</h1><span class="mark">KPWR</span></div>
  <div class="lineinfo"><span>${SYM[S.chosen].name}</span><span>${done} of ${g.size} cells</span></div>${grid('trace',g)}
  <div class="lineinfo"><span>tap the cells, or draw along them</span><span>${S.trace.size>g.size?S.trace.size-g.size+' extra':''}</span></div>
  <div class="foot"><button class="btn" id="clearT">Clear</button><button class="btn pri" id="done" ${done<g.size?'disabled':''}>Done</button></div></div>`},
 make:()=>`<div class="phone"><div class="hd"><h1>Now one of your own</h1><span class="mark">KPWR</span></div>
  <div class="lineinfo"><span>${formName(S.make)||' '}</span><span style="display:inline-flex;gap:6px;align-items:center">${svgSym(SYM[S.chosen].rows,5,'ink')}</span></div>${grid('make')}
  <div class="lineinfo"><span>${S.make.size} cells</span><span></span></div>
  <div class="foot"><button class="btn" id="undoM">Undo</button><button class="btn" id="clearM">Clear</button><button class="btn pri" id="toRow" ${S.make.size<3?'disabled':''}>Send to the table</button></div></div>`,
 keys:()=>{const m=madeRows(),per=S.period||defPeriod(m);const a=archiveRow(S.chosen);const r=layRow(m,S.arr,per);
  const ICO={both:'\u2b0c\u2b0d',mirror:'\u2b0c',repeat:'\u2192',turn:'\u21bb'};
  return `<div class="inst"><div class="strip"><span class="k"><span>GIVEN \u00b7 AS ON THE PLATES \u00b7 ${SYM[S.chosen].name}</span><span>next to itself ${SYM[S.chosen].given.dx} across${SYM[S.chosen].given.dy?', '+SYM[S.chosen].given.dy+' up':''}, ${SYM[S.chosen].given.n} times</span></span>${svgRow(a.row,8,'archive')}
   <span class="k"><span>YOURS \u00b7 ${madeName()} \u00b7 KPWR</span><span>${ARR.find(x=>x.id===S.arr).name}, every ${per} cells</span></span>${svgRow(r,8,'made')}</div>
  <div class="keys">${ARR.map(x=>`<button class="key ${S.arr===x.id?'sel':''}" data-arr="${x.id}"><span class="ico">${ICO[x.id]}</span><span>${x.name}</span><span class="cnt">${x.n} of 383 bands</span></button>`).join('')}<span></span>
   <button class="key ped" data-dp="-1">\u2212</button><button class="key ped" data-dp="1">+</button><span></span><button class="key wide" id="layin">Lay it in</button></div>
  <div class="legend"><span>arrangement \u00b7 counted on the 1953 plates</span><span>repeats every ${per} cells</span><span>to the band</span></div></div>`},
 sent:()=>{const rows=bandRows().slice(-2);return `<div class="phone"><div class="hd"><h1>Sent</h1><span class="mark">KPWR</span></div>
  <div class="rowbox"><span class="k">GIVEN · ANIMATED</span>${svgRow(rows[0].row,7,'archive',{ink:'#222'})}<span class="nm muted" style="font-size:10px">${SYM[S.chosen].name} · 200 ms per cell · 1 stroke</span></div>
  <div class="rowbox"><span class="k">MADE · ASSEMBLED</span>${svgRow(rows[1].row,7,'made',{ink:'#222'})}<span class="nm muted" style="font-size:10px">${madeName()} · ${ARR.find(x=>x.id===S.arr).name} · 310 ms per cell · 2 strokes · pause 920 ms</span></div>
  <div class="where" id="where"><b>Rows 11 and 12 · enter in 14 s</b><span class="muted">on paper about 40 s after · your mark KPWR beside them</span></div>
  <div class="foot"><button class="btn" id="again">Make another</button><button class="btn" id="pickAnother">Pick another</button></div></div>`},
 band:()=>{const rows=bandRows().slice(-7);return `<div class="disp">${dispBar(1)}<div class="band" style="padding:4px">${rowsBlock(rows,10,4)}</div><div class="labels"><span>newest row at the bottom · the paper follows four rows behind</span></div></div>`},
 printer:()=>{const rows=bandRows().slice(-7,-2);return `<div class="printer"><div class="body"></div><div class="paper">
  <div>ornament rows · 11 Nov 2026</div>
  ${rows.map(r=>`<div class="prow">${svgRow(r.row,5,r.kind,{ink:'#222'})}<div style="font-size:9px;color:#555">${r.label.replace(/<br>/g,' · ')}</div></div>`).join('')}
  <div class="prow" style="overflow:hidden;height:14px">${svgRow(bandRows().slice(-2)[0].row,5,'archive',{ink:'#222'})}</div>
  <div class="edge"><span>printing row 11 · 4 s a row</span></div>
  <div class="tear" id="tear" style="margin-top:22px;text-align:center;color:#888">tear here</div></div></div>`}};

const DEVS=[['phone','Phone'],['table','Table · keys'],['display','Laptop · projector'],['printer','Printer']];
function side(){const st=STEPS[S.step];return `<aside class="side"><div class="brand">The room weaves</div><div class="sec">IN THE ROOM</div>${DEVS.map(([k,n])=>`<div class="nav ${st.dev===k?'on':''}">${n}</div>`).join('')}<div class="sec">RELAY</div><div class="nav">192.168.2.1:4370</div><div class="note">given rows come from where a symbol stands on the plates · made rows are played into shape on the table keys, from the plates\u2019 arrangements · the printer prints the band as it grows, 47 cells across</div></aside>`}
function render(){const st=STEPS[S.step];
 $('#wtTop').innerHTML=`<div class="dots">${STEPS.map((x,i)=>`<i class="${i<=S.step?'on':''}" data-jump="${i}" title="${x.title}"></i>`).join('')}</div><div class="title">${S.step+1} of ${STEPS.length} · ${st.title}</div><span class="lab">CONSUME</span><div class="story">${st.cons}</div>`;
 $('#wtBot').innerHTML=`<span class="lab">AFFORDANCE</span><div class="story">${st.aff}</div><span class="act">${st.act} ↗</span><div class="nav"><button id="prev" ${S.step===0?'disabled':''}>Back</button><button class="next" id="next">${S.step<STEPS.length-1?'Next · '+STEPS[S.step+1].title+' →':'Start again ↺'}</button></div>`;
 $('#app').innerHTML=side()+`<main class="main">${PAGES[st.page]()}</main>`;
 document.querySelector(st.hot)?.classList.add('hot')}
function go(i){S.step=(i+STEPS.length)%STEPS.length;render()}
let painting=null;
document.addEventListener('pointerdown',e=>{const c=e.target.closest('[data-cell]');if(!c)return;const w=c.closest('[data-grid]').dataset.grid;painting={w,on:!S[w].has(c.dataset.cell)};paint(c)});
document.addEventListener('pointerover',e=>{if(!painting)return;const c=e.target.closest('[data-cell]');if(c&&c.closest('[data-grid]')?.dataset.grid===painting.w)paint(c)});
document.addEventListener('pointerup',()=>{painting=null});
function paint(c){const k=c.dataset.cell,set=S[painting.w];if(painting.on)set.add(k);else set.delete(k);render()}
document.addEventListener('click',e=>{const t=e.target.closest('button,[data-pick],[data-arr],[data-jump],#qr,#where,#tear,#newest');if(!t)return;
 if(t.id==='next')return go(S.step+1);if(t.id==='prev')return go(S.step-1);if(t.dataset.jump)return go(+t.dataset.jump);
 if(t.id==='qr')return go(1);
 if(t.dataset.pick){S.chosen=t.dataset.pick;S.trace=new Set();return go(2)}
 if(t.id==='redeal')return render();
 if(t.id==='clearT'){S.trace=new Set();return render()}
 if(t.id==='done')return go(3);
 if(t.id==='undoM'){const a=[...S.make];a.pop();S.make=new Set(a);S.period=null;return render()}
 if(t.id==='clearM'){S.make=new Set();S.period=null;return render()}
 if(t.id==='toRow')return go(4);
 if(t.dataset.arr){S.arr=t.dataset.arr;return render()}
 if(t.dataset.dp){const w=madeRows()[0].length;S.period=Math.max(w,Math.min(23,(S.period||defPeriod(madeRows()))+ +t.dataset.dp));return render()}
 if(t.id==='layin')return go(5);
 if(t.id==='again'){S.make=new Set();S.period=null;return go(3)}
 if(t.id==='pickAnother'){S.trace=new Set();S.make=new Set();S.period=null;return go(1)}
 if(t.id==='where')return go(6);
 if(t.id==='newest')return go(7);
 if(t.id==='tear')return go(0)});
document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea'))return;if(e.key==='ArrowRight')go(S.step+1);if(e.key==='ArrowLeft')go(S.step-1)});
render();
</script>
</body>
</html>
